[project]
name = "technik-agent"
version = "0.1.0"
description = "The Technik Production Assistant on Microsoft Agent Framework"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.22.0",
    "agent-framework-foundry==1.15.0",
    "mcp==1.30.0",
    "python-dotenv==1.2.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
