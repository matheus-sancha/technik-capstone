# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Stage 5: the Foundry side of the deployment. infra/ holds the server's side; the README gives the order.
requiredVersions:
  azd: ">=1.32.0"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.17"
    azure.ai.connections: ">=1.0.0-beta.8"
    azure.ai.toolboxes: ">=1.0.0-beta.8"
name: technik-capstone

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-4.1-mini
        model:
          format: OpenAI
          name: gpt-4.1-mini
          version: "2025-04-14"
        sku:
          name: GlobalStandard
          capacity: 10

  # The stage 2 server on Container Apps. Foundry calls it with a token for the agent's identity.
  teamcenter:
    host: azure.ai.connection
    uses:
      - ai-project
    category: RemoteTool
    target: ${TEAMCENTER_MCP_URL}
    authType: AgenticIdentityToken
    audience: ${TEAMCENTER_AUDIENCE}
    env:
      TEAMCENTER_MCP_URL: ${TEAMCENTER_MCP_URL}
      TEAMCENTER_AUDIENCE: ${TEAMCENTER_AUDIENCE}

  technik-tools:
    host: azure.ai.toolbox
    uses:
      - ai-project
      - teamcenter
    description: Read-only Teamcenter lookups for the Technik Production Assistant
    env:
      TEAMCENTER_MCP_URL: ${TEAMCENTER_MCP_URL}
    tools:
      - type: mcp
        server_label: teamcenter
        server_url: ${TEAMCENTER_MCP_URL}
        connection: teamcenter
        require_approval: never

  technik-agent:
    host: azure.ai.agent
    project: agent
    language: docker
    uses:
      - ai-project
      - teamcenter
      - technik-tools
    toolboxes:
      - technik-tools
    kind: hosted
    name: technik-production-assistant
    description: Answers questions about Technik's controlled documents and revisions from Teamcenter.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      MICROSOFT_FOUNDRY_MODEL_DEPLOYMENT_NAME: gpt-4.1-mini
      TOOLBOX_NAME: technik-tools
    startupCommand: python hosted.py
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
